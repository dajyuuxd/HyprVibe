# Kitty Terminal Configuration
# Compact, modern dark theme suited for small screens

# --- Fonts ---
font_family      SauceCodePro Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# --- Dynamic Font Size Scaling ---
# Scale font with Super + - and Super + = (resets to default 10.5 on exit)
map super+equal       change_font_size all +1.5
map super+plus        change_font_size all +1.5
map super+minus       change_font_size all -1.5
map super+kp_add      change_font_size all +1.5
map super+kp_subtract change_font_size all -1.5
map super+0           change_font_size all 0

# --- Window Layout ---
remember_window_size  no
initial_window_width  700
initial_window_height 450
window_padding_width  8 10
hide_window_decorations yes
confirm_os_window_close 0

# --- Window Appearance & Colors (Catppuccin Mocha) ---
background_opacity 0.94
background         #1e1e2e
foreground         #cdd6f4
selection_background #45475a
selection_foreground #cdd6f4

# Cursor
cursor            #f5e0dc
cursor_text_color #11111b
cursor_shape      beam
cursor_blink_interval 0.5

# URL style
url_color         #89b4fa
url_style         curly

# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #cba6f7
color13 #cba6f7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# --- Behavior ---
enable_audio_bell no
scrollback_lines 5000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 2.0
copy_on_select yes
clipboard_control write-clipboard write-primary read-clipboard read-primary
